<svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
  <!-- Background -->
  <rect width="800" height="240" fill="#0C0C0C"/>

  <!-- Title -->
  <text x="400" y="52" font-family="'Courier New', Courier, monospace" font-size="36" fill="#B8B8B8" letter-spacing="8" text-anchor="middle">IMPULSE INSTRUCT</text>

  <!-- Tagline -->
  <text x="400" y="78" font-family="'Courier New', Courier, monospace" font-size="11" fill="#383838" letter-spacing="3" text-anchor="middle">a synthesizer with a tiny LLM living inside it</text>

  <!-- Horizontal rule -->
  <line x1="60" y1="90" x2="740" y2="90" stroke="#282828" stroke-width="1"/>

  <!-- Piano keyboard group: centered at x=130, white keys span 15*36=540px -->
  <g transform="translate(130, 100)">

    <!-- White keys (back layer) -->
    <!-- C3 -->
    <rect x="0"   y="0" width="35" height="88" rx="2" fill="#3366DD"/>
    <!-- D3 -->
    <rect x="36"  y="0" width="35" height="88" rx="2" fill="#33AA66"/>
    <!-- E3 -->
    <rect x="72"  y="0" width="35" height="88" rx="2" fill="#DDCC22"/>
    <!-- F3 -->
    <rect x="108" y="0" width="35" height="88" rx="2" fill="#EE8822"/>
    <!-- G3 -->
    <rect x="144" y="0" width="35" height="88" rx="2" fill="#EE3366"/>
    <!-- A3 -->
    <rect x="180" y="0" width="35" height="88" rx="2" fill="#9966CC"/>
    <!-- B3 -->
    <rect x="216" y="0" width="35" height="88" rx="2" fill="#4433AA"/>
    <!-- C4 -->
    <rect x="252" y="0" width="35" height="88" rx="2" fill="#3366DD"/>
    <!-- D4 -->
    <rect x="288" y="0" width="35" height="88" rx="2" fill="#33AA66"/>
    <!-- E4 -->
    <rect x="324" y="0" width="35" height="88" rx="2" fill="#DDCC22"/>
    <!-- F4 -->
    <rect x="360" y="0" width="35" height="88" rx="2" fill="#EE8822"/>
    <!-- G4 -->
    <rect x="396" y="0" width="35" height="88" rx="2" fill="#EE3366"/>
    <!-- A4 -->
    <rect x="432" y="0" width="35" height="88" rx="2" fill="#9966CC"/>
    <!-- B4 -->
    <rect x="468" y="0" width="35" height="88" rx="2" fill="#4433AA"/>
    <!-- C5 -->
    <rect x="504" y="0" width="35" height="88" rx="2" fill="#3366DD"/>

    <!-- Separator lines (E-F and B-C boundaries, no black key) -->
    <line x1="108" y1="0" x2="108" y2="88" stroke="#0C0C0C" stroke-width="1"/>
    <line x1="252" y1="0" x2="252" y2="88" stroke="#0C0C0C" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="88" stroke="#0C0C0C" stroke-width="1"/>
    <line x1="504" y1="0" x2="504" y2="88" stroke="#0C0C0C" stroke-width="1"/>

    <!-- Black keys (front layer) -->
    <!-- Octave 3 -->
    <!-- C#3 x=26 -->
    <rect x="16"  y="0" width="20" height="54" rx="1" fill="#2299BB"/>
    <!-- D#3 x=62 -->
    <rect x="52"  y="0" width="20" height="54" rx="1" fill="#88CC22"/>
    <!-- F#3 x=134 -->
    <rect x="124" y="0" width="20" height="54" rx="1" fill="#DD4422"/>
    <!-- G#3 x=170 -->
    <rect x="160" y="0" width="20" height="54" rx="1" fill="#CC1144"/>
    <!-- A#3 x=206 -->
    <rect x="196" y="0" width="20" height="54" rx="1" fill="#7744BB"/>
    <!-- Octave 4 -->
    <!-- C#4 x=278 -->
    <rect x="268" y="0" width="20" height="54" rx="1" fill="#2299BB"/>
    <!-- D#4 x=314 -->
    <rect x="304" y="0" width="20" height="54" rx="1" fill="#88CC22"/>
    <!-- F#4 x=386 -->
    <rect x="376" y="0" width="20" height="54" rx="1" fill="#DD4422"/>
    <!-- G#4 x=422 -->
    <rect x="412" y="0" width="20" height="54" rx="1" fill="#CC1144"/>
    <!-- A#4 x=458 -->
    <rect x="448" y="0" width="20" height="54" rx="1" fill="#7744BB"/>

    <!-- Note labels -->
    <text x="17"  y="83" font-family="monospace" font-size="8" fill="#00000088" text-anchor="middle">C3</text>
    <text x="269" y="83" font-family="monospace" font-size="8" fill="#00000088" text-anchor="middle">C4</text>
    <text x="521" y="83" font-family="monospace" font-size="8" fill="#00000088" text-anchor="middle">C5</text>

  </g>
</svg>
