<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Background: #0C0C0C (R=G=B=12) -->
  <rect width="256" height="256" fill="#0C0C0C"/>

  <!--
    One octave C–B, 7 white keys, centered in 256×256.
    White key: width=28, gap=1 → stride=29. Height=144.
    7 keys × 29 = 203px wide → x_start = (256-203)/2 = 26.5 → 27
    (last key ends at 27 + 6*29 + 28 = 27 + 174 + 28 = 229)
    Black key: width=17, height=90. rx=1.
    Centered at gap: x = key_left + stride - 9  (= gap_center - 8.5)
    C# : 27 + 29 - 9 = 47
    D# : 27 + 2*29 - 9 = 76
    F# : 27 + 4*29 - 9 = 134
    G# : 27 + 5*29 - 9 = 163
    A# : 27 + 6*29 - 9 = 192
    Keyboard y_start = (256-144)/2 = 56
  -->
  <g transform="translate(27, 56)">

    <!-- White keys -->
    <rect x="0"   y="0" width="28" height="144" rx="3" fill="#3366DD"/><!-- C -->
    <rect x="29"  y="0" width="28" height="144" rx="3" fill="#33AA66"/><!-- D -->
    <rect x="58"  y="0" width="28" height="144" rx="3" fill="#DDCC22"/><!-- E -->
    <rect x="87"  y="0" width="28" height="144" rx="3" fill="#EE8822"/><!-- F -->
    <rect x="116" y="0" width="28" height="144" rx="3" fill="#EE3366"/><!-- G -->
    <rect x="145" y="0" width="28" height="144" rx="3" fill="#9966CC"/><!-- A -->
    <rect x="174" y="0" width="28" height="144" rx="3" fill="#4433AA"/><!-- B -->

    <!-- E–F separator (no black key between E and F) -->
    <line x1="87"  y1="0" x2="87"  y2="144" stroke="#0C0C0C" stroke-width="1"/>

    <!-- White key labels -->
    <text x="14"  y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">C</text>
    <text x="43"  y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">D</text>
    <text x="72"  y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">E</text>
    <text x="101" y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">F</text>
    <text x="130" y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">G</text>
    <text x="159" y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">A</text>
    <text x="188" y="136" font-family="monospace" font-size="9" fill="#0C0C0C" opacity="0.55" text-anchor="middle">B</text>

    <!-- Black keys -->
    <rect x="47"  y="0" width="17" height="90" rx="1" fill="#2299BB"/><!-- C# -->
    <rect x="76"  y="0" width="17" height="90" rx="1" fill="#88CC22"/><!-- D# -->
    <rect x="134" y="0" width="17" height="90" rx="1" fill="#DD4422"/><!-- F# -->
    <rect x="163" y="0" width="17" height="90" rx="1" fill="#CC1144"/><!-- G# -->
    <rect x="192" y="0" width="17" height="90" rx="1" fill="#7744BB"/><!-- A# -->

    <!-- Black key labels -->
    <text x="55"  y="83" font-family="monospace" font-size="7" fill="#0C0C0C" opacity="0.5" text-anchor="middle">C#</text>
    <text x="84"  y="83" font-family="monospace" font-size="7" fill="#0C0C0C" opacity="0.5" text-anchor="middle">D#</text>
    <text x="142" y="83" font-family="monospace" font-size="7" fill="#0C0C0C" opacity="0.5" text-anchor="middle">F#</text>
    <text x="171" y="83" font-family="monospace" font-size="7" fill="#0C0C0C" opacity="0.5" text-anchor="middle">G#</text>
    <text x="200" y="83" font-family="monospace" font-size="7" fill="#0C0C0C" opacity="0.5" text-anchor="middle">A#</text>

  </g>
</svg>
