name: CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Test + coverage (runs on every push/PR to main and develop) ────────────
  test:
    name: Unit tests & coverage
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: Unit tests
        # LLM integration tests (scripts/run-llm-*.sh) are excluded — they
        # require a running CUDA GPU + llama-server. Run those locally.
        run: cargo test

      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Coverage
        run: cargo tarpaulin --config .tarpaulin.toml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Release build + SHA-256 attestation (runs on tagged releases only) ─────
  #
  # Security model: binaries are built entirely in GitHub's infrastructure,
  # never touched by a maintainer's local machine.  Each artifact is
  # accompanied by a .sha256 checksum file so users can verify what they
  # downloaded matches what CI produced.  The build provenance is recorded
  # via actions/attest-build-provenance (SLSA level 2), giving a signed
  # attestation that links the artifact back to this exact commit and workflow
  # run.  Users can verify with: `gh attestation verify <file> --repo Tok/impulse-instruct`
  #
  # This directly addresses the class of supply-chain attack where a
  # maintainer swaps a pre-built binary for a malicious one before publishing.
  release:
    name: Release build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write   # upload release assets
      id-token:  write  # needed by attest-build-provenance (OIDC token)
      attestations: write

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: impulse-instruct
            asset_name: impulse-instruct-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: impulse-instruct.exe
            asset_name: impulse-instruct-windows-x86_64.exe

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libxcb-xfixes0-dev \
            libxcb-shape0-dev \
            libxcb-xkb-dev \
            libxkbcommon-dev \
            pkg-config

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-${{ matrix.target }}-

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Rename binary
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.binary }} ${{ matrix.asset_name }}

      - name: Bundle config + data files
        shell: bash
        run: |
          # Create a zip containing binary + configs + start scripts.
          # This is the primary distribution — users extract and run.
          mkdir -p bundle/models bundle/scripts
          cp ${{ matrix.asset_name }} bundle/
          for f in config.json instructions.json styles.json; do
            [ -f "$f" ] && cp "$f" bundle/
          done
          # Start scripts so users get terminal log output
          [ -f start.sh ] && cp start.sh bundle/
          [ -f start.bat ] && cp start.bat bundle/
          # Download helper scripts
          for f in scripts/download-models.sh scripts/download-models.bat; do
            [ -f "$f" ] && cp "$f" bundle/scripts/
          done
          echo "# Place .gguf model files here. See README for download instructions." > bundle/models/README.md
          cd bundle
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            7z a ../${{ matrix.asset_name }}.zip .
          else
            zip -r ../${{ matrix.asset_name }}.zip .
          fi
          cd ..

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            certutil -hashfile ${{ matrix.asset_name }} SHA256 | grep -v "^SHA" | tr -d ' \r\n' > ${{ matrix.asset_name }}.sha256
            echo "  ${{ matrix.asset_name }}" >> ${{ matrix.asset_name }}.sha256
          else
            sha256sum ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256
          fi
          echo "=== SHA-256 ==="
          cat ${{ matrix.asset_name }}.sha256

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ matrix.asset_name }}

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ## Impulse Instruct ${{ github.ref_name }}

            A smart synthesizer with a virtual production team inside — multiple LLM agents collaborate to write patterns, shape sound, and evolve tracks in real time.

            ### Quick start
            1. Download the `.zip` for your platform
            2. Extract — you'll get the binary, configs, start scripts, and a `models/` folder
            3. Run `scripts/download-models.sh` (or `.bat`) to fetch Gemma 4 E4B (~4.6 GB)
            4. Run `./start.sh` (Linux) or `start.bat` (Windows) — this launches the app with terminal logging

            ### Verify
            ```
            sha256sum impulse-instruct-linux-x86_64
            gh attestation verify impulse-instruct-linux-x86_64 --repo Tok/impulse-instruct
            ```

            ### System requirements
            - **Linux**: `libasound2`, `libxcb` (standard on most distros)
            - **Windows**: Windows 10+ x64, MSVC runtime (usually pre-installed)
            - **LLM inference**: NVIDIA GPU recommended; CPU inference works but is slow

            ### Recommended models
            - **Gemma 4 E4B Q4_K_M** (~4.6 GB) — best accuracy, default; needed for all presets
            - **Bonsai 8B Q1_0_g128** (~1.1 GB) — lightweight agent for multi-model teams
          files: |
            ${{ matrix.asset_name }}.zip
            ${{ matrix.asset_name }}.sha256

  # ── Rolling release cleanup ────────────────────────────────────────────────
  # Keep only the latest release. Runs after both matrix builds finished
  # uploading, so the current tag is already published by the time we
  # scan for older ones.
  cleanup_old_releases:
    name: Delete prior releases (rolling)
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Delete all GitHub releases except ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEP_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          echo "Keeping: $KEEP_TAG"
          # List tag names of all releases, skip the current one, delete each
          # along with its underlying git tag (--cleanup-tag).
          gh release list --limit 100 --json tagName \
            --jq '.[].tagName' \
          | while IFS= read -r tag; do
              if [ "$tag" != "$KEEP_TAG" ]; then
                echo "Deleting $tag"
                gh release delete "$tag" --yes --cleanup-tag || true
              fi
            done
