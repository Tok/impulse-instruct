[package]
name = "impulse-instruct"
version = "0.7.7-snapshot"
edition = "2024"

[[bin]]
name = "impulse-instruct"
path = "src/main.rs"

[[bin]]
name = "model_eval"
path = "src/bin/model_eval/main.rs"

[dependencies]
# Audio I/O
cpal = "0.15"

# DSP graph
fundsp = { version = "0.18", default-features = false, features = ["std"] }

# UI — immediate-mode, cross-platform
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"
# Native file dialogs for File → Open / Open Project.  `xdg-portal` feature
# lets Linux flatpaks / distros without gtk still get a working picker via
# the freedesktop XDG portal.
rfd = { version = "0.14", default-features = false, features = ["xdg-portal", "tokio"] }

# HTTP API (MCP bridge) + llama-server HTTP client
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }
ureq = { version = "2", features = ["json"] }

# MIDI
midir = "0.9"

# OSC (Open Sound Control) — UDP listener for Max/MSP, TouchOSC, Ableton
rosc = "0.9"
midi-msg = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WAV encoding (export)
hound = "3"

# Lock-free audio↔UI ring buffer (wait-free, no-alloc in callback)
rtrb = "0.3"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Utilities
libc = "0.2"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"
rustfft = "6"

[features]
# Run LLM response suite against a real llama-server
# ./run-llm-tests.sh   (or: cargo test --features llm-tests)
llm-tests = []

[profile.release]
opt-level = 3
lto = "thin"

# Coverage config lives in .tarpaulin.toml — see that file.
