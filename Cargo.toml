[package]
name = "impulse-instruct"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "impulse-instruct"
path = "src/main.rs"

[dependencies]
# Audio I/O
cpal = "0.15"

# DSP graph
fundsp = { version = "0.18", default-features = false, features = ["std"] }

# LLM inference (wraps llama.cpp) — requires libclang: sudo apt install libclang-dev
llama-cpp-2 = { version = "0.1", optional = true }

# UI — immediate-mode, cross-platform
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"

# HTTP API (MCP bridge)
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# MIDI
midir = "0.9"
midi-msg = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Lock-free audio↔UI ring buffer (wait-free, no-alloc in callback)
rtrb = "0.3"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Utilities
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[features]
# Enable real LLM inference (requires libclang-dev and cmake)
llm = ["llama-cpp-2"]
cuda = ["llama-cpp-2/cuda", "llm"]

[profile.release]
opt-level = 3
lto = "thin"
