[package]
name = "impulse-instruct"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "impulse-instruct"
path = "src/main.rs"

[dependencies]
# Audio I/O
cpal = "0.15"

# DSP graph
fundsp = { version = "0.18", default-features = false, features = ["std"] }

# LLM inference (wraps llama.cpp) — requires libclang: sudo apt install libclang-dev
llama-cpp-2 = { git = "https://github.com/utilityai/llama-cpp-rs", optional = true }

# UI — immediate-mode, cross-platform
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow"] }
egui = "0.28"

# HTTP API (MCP bridge)
axum = { version = "0.7", features = ["json"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["cors"] }

# MIDI
midir = "0.9"
midi-msg = "0.5"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# WAV encoding (export)
hound = "3"

# Lock-free audio↔UI ring buffer (wait-free, no-alloc in callback)
rtrb = "0.3"

# Concurrency
parking_lot = "0.12"
crossbeam-channel = "0.5"

# Character encoding — used by llama-cpp-2's token_to_piece API
encoding_rs = "0.8"

# Utilities
anyhow = "1"
log = "0.4"
env_logger = "0.11"
thiserror = "1"

[features]
# LLM inference is on by default — it's integral to the synth.
# Requires: sudo apt install libclang-dev cmake
# To build without (mock-only, no libclang needed): cargo build --no-default-features
default = ["llm"]
llm = ["llama-cpp-2"]
cuda = ["llama-cpp-2/cuda", "llm"]
# Run LLM response suite against real Bonsai inference
# Requires: libclang-dev cmake + ./download-models.sh
# cargo test --features llm-tests   (or ./run-llm-tests.sh)
llm-tests = ["llm"]

[profile.release]
opt-level = 3
lto = "thin"
